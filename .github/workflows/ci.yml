name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig build -Doptimize=ReleaseFast
      - run: zig build
      - run: python3 python/swarmbus.py --self-test
      - run: cargo test --manifest-path rust/Cargo.toml
